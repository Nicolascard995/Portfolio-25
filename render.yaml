services:
  # Base de datos PostgreSQL
  - type: pserv
    name: dozotech-db
    env: postgresql
    databaseName: dozotech
    user: dozotech_user

  # Backend FastAPI
  - type: web
    name: dozotech-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dozotech-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dozotech-frontend.onrender.com,https://dozo.tech,https://www.dozo.tech
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Next.js
  - type: web
    name: dozotech-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://dozotech-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://dozotech-frontend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://dozotech-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /_next/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable" 