services:
  - type: pserv
    name: dozotech-db
    env: postgresql
    databaseName: dozotech
    user: dozotech_user

  - type: web
    name: dozotech-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dozotech-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://dozotech-frontend.onrender.com,https://dozo.tech,https://www.dozo.tech"
      - key: ENVIRONMENT
        value: production

  - type: web
    name: dozotech-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: "https://dozotech-backend.onrender.com"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://dozotech-frontend.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://dozotech-backend.onrender.com"
      - key: NODE_ENV
        value: production 