services:
  - type: web
    name: dozotech-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://dozotech-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://dozotech-frontend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://dozotech-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /_next/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable" 